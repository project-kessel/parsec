# parsec Configuration - Minimal Example
#
# This is a minimal working configuration using stub implementations
# for testing and development. For production use, see parsec-production.yaml

server:
  grpc_port: 9090
  http_port: 8080

# Observability configuration
observability:
  type: composite
  log_level: info
  log_format: json
  observers:
    - type: logging
    - type: metrics

# Trust domain for this parsec instance
# Used as the audience (aud) claim in all issued tokens
trust_domain: "parsec.example.com"

# Exchange server configuration
exchange_server:
  # Claims filter (determines which request_context claims actors can provide)
  claims_filter:
    type: stub  # Allow all claims (passthrough)

# Trust store configuration
trust_store:
  type: stub_store
  validators:
    - name: redhat-sso
      type: jwt_validator
      issuer: "https://sso.redhat.com/auth/realms/redhat-external"
      jwks_url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/certs"
      trust_domain: "https://sso.redhat.com/auth/realms/redhat-external"
      refresh_interval: "15m"
      audiences: ["rhsm-api", "customer-portal", "api.console", ""]

    # IETF unsigned JSON subject tokens (draft-ietf-oauth-transaction-tokens).
    # Phase 1: no actor authentication; access control via network policy,
    # on par with 3scale internal API.
    - name: unsigned-json
      type: unsigned_json_validator
      trust_domain: "parsec.example.com"

# Named HTTP clients. BOP credentials are injected here (http_auth.headers),
# not in the Lua script.
#
# Prerequisites for live BOP:
#   - PARSEC_BOP_CLIENT_ID, PARSEC_BOP_TOKEN
#   - CA bundle mounted by deployment (ca_cert field below)
#
# entitlements.base_url is the shared host for /v1/compliance (and later
# /v1/services). Overlay: PARSEC_HTTP_CLIENTS__1__BASE_URL
http_clients:
  - name: backoffice-proxy
    timeout: "30s"
    # ca_cert: provided by deployment secret; omit for hermetic/dev use.
    http_auth:
      type: headers
      headers:
        x-rh-clientid:
          env: PARSEC_BOP_CLIENT_ID
        x-rh-apitoken:
          env: PARSEC_BOP_TOKEN
  - name: entitlements
    timeout: "5s"
    base_url: "https://entitlements.internal.example.com"

# Data sources for token enrichment
data_sources:
  - name: identity-policy
    type: static
    data:
      internal_idp_target: "https://sso.redhat.com/auth/realms/internal"
      role_fallback_enabled: true
      enforce_idp_auth: false
  # Export compliance (RHCLOUD-49359 / RHCLOUD-50834): called unless Envoy sets
  # context_extensions.export_compliance=false on User jwt-auth paths.
  # Absent extension → check on (opt-out). Missing DS → CEL skips (fail-safe).
  # Path resolves against http_clients.entitlements.base_url.
  # Full-URL override: PARSEC_DATA_SOURCES__1__CONFIG__COMPLIANCE_API
  - name: export_compliance
    type: lua
    script_file: ./configs/scripts/export_compliance.lua
    http_client: entitlements
    config:
      compliance_api: "/v1/compliance"
    caching:
      type: in_memory
      ttl: 24h
      group_name: compliance-cache

  - name: bop-user
    type: lua
    script_file: ./configs/scripts/bop_user.lua
    http_client: backoffice-proxy
    config:
      bop_url: "https://backoffice-proxy.apps.ext.spoke.preprod.us-west-2.aws.paas.redhat.com"
      users_path: "/v1/users"
      bop_env: "stage"
    caching:
      type: in_memory
      ttl: 5m

# Token issuers
#
# CEL claim mappers are the unified layer for claim transformation AND issuance
# policy. Scripts may abort with:
#   Layer B (preferred for guards): invalidSubject(), invalidActor(), …
#     → OAuth error + machine reason (e.g. invalid_request + invalid_subject)
#   Layer A (direct codes): invalidRequest(), invalidTarget(), …
#   fail() — mapping/system failures only (Internal; not an OAuth client error)
# See docs/issuance-policy.md and internal/cel/README.md.
issuers:
  # Transaction token issuer (stub for testing)
  - token_type: "urn:ietf:params:oauth:token-type:txn_token"
    type: stub
    issuer_url: "https://parsec.example.com"
    ttl: 5m
    # Transaction context mappers build the "tctx" claim
    # (redhat_identity.cel includes 3scale-parity policy guards)
    transaction_context:
      - type: cel
        name: redhat-identity-mapper
        script_file: ./configs/scripts/redhat_identity.cel
    # Request context mappers build the "req_ctx" claim
    request_context:
      - type: request_attributes  # Include request path, method, etc.

  # Red Hat identity token issuer
  - token_type: "urn:redhat:params:oauth:token-type:rh-identity"
    type: unsigned
    # Claim mappers build the full x-rh-identity envelope (identity + entitlements)
    claim_mappers:
      - type: cel
        name: redhat-identity-mapper
        script_file: ./configs/scripts/redhat_identity.cel

# Credential sources define how incoming credentials are extracted from
# requests. Sources are tried in order; the first match wins.
#
# This list is shared by all three extraction paths:
#   - ext_authz subject (Envoy HTTP headers)
#   - ext_authz actor   (gRPC metadata)
#   - exchange caller   (gRPC metadata)
#
# Sources return no match when the expected header is absent, so including
# all source types here is safe. When no credential_sources are configured,
# parsec defaults to bearer-only (Authorization: Bearer).
credential_sources:
  - name: authorization-bearer
    type: authorization_bearer_opaque
  - name: cs-jwt-cookie
    type: cookie_bearer_opaque
    cookie_name: cs_jwt

# Authorization server configuration (ext_authz)
authz_server:
  policy:
    type: static_authenticated
    token_types:
      - type: "urn:ietf:params:oauth:token-type:txn_token"
        header_name: "Transaction-Token"
      - type: "urn:redhat:params:oauth:token-type:rh-identity"
        header_name: "x-rh-identity"
