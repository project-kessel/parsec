# parsec Configuration - Issuance Policy Example
#
# Demonstrates the issuance policy (pipeline step 6) with path_passthrough.
# Health/readiness paths passthrough without token issuance.
# All other authenticated requests proceed to normal token issuance.

server:
  grpc_port: 9090
  http_port: 8080

trust_domain: "parsec.example.com"

observability:
  type: logging
  log_level: debug
  log_format: json

exchange_server:
  claims_filter:
    type: stub

trust_store:
  type: stub_store
  validators:
    - type: stub_validator

data_sources: []

issuers:
  - token_type: "urn:ietf:params:oauth:token-type:txn_token"
    type: stub
    issuer_url: "https://parsec.example.com"
    ttl: 5m
    transaction_context:
      - type: passthrough
    request_context:
      - type: request_attributes

authz_server:
  token_types:
    - type: "urn:ietf:params:oauth:token-type:txn_token"
      header_name: "Transaction-Token"

  # Issuance policy: passthrough health/readiness probes without issuing tokens,
  # even when valid credentials are present.
  issuance_policy:
    type: path_passthrough
    patterns:
      - path: "^/healthz"
        outcome: passthrough
      - path: "^/readyz"
        outcome: passthrough
      - path: "^/openapi\\.json$"
        outcome: passthrough
