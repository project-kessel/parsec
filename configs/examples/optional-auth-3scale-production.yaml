# 3scale production optional-auth paths (regex-only).
#
# Verbatim port of the 3scale production optional-auth regex list. All patterns
# use match: regex with full ^/...$ anchoring.
#
# Merge authz_server.optional_auth_paths into your Parsec config.
# See configs/README.md for match-type semantics and security notes.

authz_server:
  optional_auth_paths:
    - path: '^/r/insights/platform/[^/]+/v[0-9]+(\.[0-9]+)?/openapi.json$'
      match: regex
    - path: '^/api/[^/]+/v[0-9]+(\.[0-9]+)?/openapi.json$'
      match: regex
    - path: '^/api/approval/v[0-9]+(\.[0-9]+)?/stageaction/[^/]+$'
      match: regex
    - path: '^/api/insights/v[0-9]+(\.[0-9]+)?/kcs/.*$'
      match: regex
    - path: '^/api/approval/static/.*$'
      match: regex
    - path: '^/api/commit-tracker/github$'
      match: regex
    - path: '^/api/cloudigrade/v2/azure-offer-template/?$'
      match: regex
    - path: '^/api/vmaas/.*$'
      match: regex
    - path: '^/api/tower-analytics/v[0-9]+(\.[0-9]+)?/generate_pdf/.*$'
      match: regex
    - path: '^/api/insights-results-aggregator/v[0-9]+(\.[0-9]+)?/info/?$'
      match: regex
    - path: '^/api/provisioning/v[0-9]+(\.[0-9]+)?/azure_offering_template$'
      match: regex
    - path: '^/api/chrome-service/v[0-9]+(\.[0-9]+)?/static/.*$'
      match: regex
    - path: '^/api/cost-management/v[0-9]+(\.[0-9]+)?/recommendations/openshift/openapi.json$'
      match: regex
    - path: '^/api/content-sources/v[0-9]+(\.[0-9]+)?/repository_gpg_key/[A-Za-z0-9]{8}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{12}$'
      match: regex
    - path: '^/api/pulp/api/v3/status/$'
      match: regex
    - path: '^/api/pulp/api/v3/docs/api.json$'
      match: regex
    - path: '^/api/pulp-content/public-.*$'
      match: regex
    - path: '^/api/pulp/public-.*$'
      match: regex
    - path: '^/api/migration-assessment/.*$'
      match: regex
    - path: '^/api/migration-advisor-dev/.*$'
      match: regex
    - path: '^/api/pypi/public-.*$'
      match: regex
    - path: '^/api/distributors/.*/v[0-9]/openapi.json$'
      match: regex
    - path: '^/api/distributors/.*/v[0-9]/docs$'
      match: regex
    - path: '^/api/distributors/openapi.json$'
      match: regex
    - path: '^/api/distributors/docs$'
      match: regex
