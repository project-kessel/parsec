apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: parsec
objects:
  - apiVersion: cloud.redhat.com/v1alpha1
    kind: ClowdApp
    metadata:
      name: parsec
    spec:
      envName: ${ENV_NAME}
      deployments:
        - name: api
          replicas: ${{REPLICAS}}
          podSpec:
            image: ${PARSEC_IMAGE}:${IMAGE_TAG}
            command: ["parsec"]
            args: ["serve", "--config", "/etc/parsec/parsec.yaml"]
            livenessProbe:
              httpGet:
                path: /healthz/live
                port: 8000
              timeoutSeconds: 5
              periodSeconds: 15
              failureThreshold: 3
            readinessProbe:
              httpGet:
                path: /healthz/ready
                port: 8000
              timeoutSeconds: 5
              periodSeconds: 10
              failureThreshold: 3
            resources:
              requests:
                memory: ${PARSEC_REQUESTS_MEMORY}
                cpu: ${PARSEC_REQUESTS_CPU}
              limits:
                memory: ${PARSEC_LIMITS_MEMORY}
                cpu: ${PARSEC_LIMITS_CPU}
            env:
              - name: CLOWDER_ENABLED
                value: "true"
              - name: PARSEC_CONFIG
                value: "/etc/parsec/parsec.yaml"
              - name: PARSEC_BOP_CERTAUTH_SECRET
                valueFrom:
                  secretKeyRef:
                    name: ${BOP_CERTAUTH_SECRET}
                    key: certauth-secret
                    optional: true
              - name: PARSEC_BOP_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: ${BOP_CLIENT_SECRET}
                    key: client_id
                    optional: true
              - name: PARSEC_BOP_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${BOP_CLIENT_SECRET}
                    key: token
                    optional: true
            volumeMounts:
              - name: config-volume
                mountPath: "/etc/parsec/parsec.yaml"
                subPath: parsec.yaml
              - name: config-volume
                mountPath: "/etc/parsec/scripts/redhat_identity.cel"
                subPath: redhat_identity.cel
              - name: config-volume
                mountPath: "/etc/parsec/scripts/registry_auth.lua"
                subPath: "registry_auth.lua"
              - name: config-volume
                mountPath: "/etc/parsec/scripts/bop_user.lua"
                subPath: bop_user.lua
              - name: config-volume
                mountPath: "/etc/parsec/scripts/cross_account.lua"
                subPath: cross_account.lua
              - name: config-volume
                mountPath: "/etc/parsec/scripts/forwarded_client_cert_auth.lua"
                subPath: forwarded_client_cert_auth.lua
              - name: registry-certs
                mountPath: "/etc/parsec/secrets/registry-certs"
                readOnly: true
              - name: it-ca-bundle
                mountPath: "/etc/parsec/secrets/it-ca-bundle"
                readOnly: true
            volumes:
              - name: config-volume
                secret:
                  secretName: ${PARSEC_CONFIG_SECRET}
              - name: registry-certs
                secret:
                  secretName: ${REGISTRY_CERTS_SECRET}
                  optional: true
              - name: it-ca-bundle
                secret:
                  secretName: ${IT_CA_BUNDLE_SECRET}
                  optional: true
          webServices:
            public:
              enabled: true
              h2cEnabled: true
              h2cTargetPort: 9800
              apiPath: parsec

  - kind: PodDisruptionBudget
    apiVersion: policy/v1
    metadata:
      name: parsec-api-pdb
    spec:
      minAvailable: 1
      selector:
        matchLabels:
          app: parsec
parameters:
  - description: ClowdEnvironment name (ephemeral, stage, prod)
    name: ENV_NAME
    required: true
  - description: Parsec container image
    name: PARSEC_IMAGE
    value: quay.io/redhat-services-prod/project-kessel-tenant/kessel-parsec
  - description: Image tag
    name: IMAGE_TAG
    required: true
    value: latest
  - description: Number of replicas
    name: REPLICAS
    value: "1"
  - description: Name of the K8s secret containing parsec config files (parsec.yaml, CEL scripts, etc.)
    name: PARSEC_CONFIG_SECRET
    value: parsec-config
  - description: Name of the K8s secret containing registry mTLS client certs
    name: REGISTRY_CERTS_SECRET
    value: registry-certs
  - description: Name of the K8s secret containing the BOP certauth proxy proof secret
    name: BOP_CERTAUTH_SECRET
    value: backoffice-proxy-config
  - description: Name of the K8s secret containing BOP client-id and token. This is separate from above secret because bop creates and manages this secret for us in its own vault dir.
    name: BOP_CLIENT_SECRET
    value: backoffice-proxy-creds
  - description: Name of the K8s secret containing the Red Hat IT CA bundle
    name: IT_CA_BUNDLE_SECRET
    value: it-ca-bundle
  - description: Memory request for Parsec service
    name: PARSEC_REQUESTS_MEMORY
    value: '256Mi'
  - description: CPU request for Parsec service
    name: PARSEC_REQUESTS_CPU
    value: '250m'
  - description: Memory limit for Parsec service
    name: PARSEC_LIMITS_MEMORY
    value: '512Mi'
  - description: CPU limit for Parsec service
    name: PARSEC_LIMITS_CPU
    value: '500m'
