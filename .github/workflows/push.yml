name: buf-push
on:
  push:
    branches:
      - main
permissions:
  contents: read

jobs:
  build:
    name: Check protos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          format: false
          lint: true
          breaking: false
          push: true
          input: "api"
          token: ${{ secrets.BUF_TOKEN }}
