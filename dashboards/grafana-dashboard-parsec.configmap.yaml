apiVersion: v1
data:
  parsec-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "expr": "max by (namespace, replicaset) (kube_replicaset_created{namespace=~\"^parsec-.*\", replicaset=~\"^parsec-api.*\"}) * 1000",
            "hide": false,
            "iconColor": "purple",
            "name": "Rollouts",
            "step": "60s",
            "tagKeys": "namespace",
            "textFormat": "{{namespace}}/{{replicaset}}",
            "titleFormat": "Rollout",
            "useValueForTime": true
          }
        ]
      },
      "description": "Parsec: ext_authz checks and RFC 8693 token exchanges. Traffic, outcomes, latency, dependencies and resource usage across all parsec-* namespaces.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Global Traffic",
          "type": "row"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "Requests/s served by parsec: ext_authz checks plus RFC 8693 token exchanges, across all parsec-* namespaces. Includes rejected and failed requests.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 7,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "interval": "5s",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table"
            },
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "round(sum(rate({__name__=~\"parsec_(authz_check|token_exchange)_duration_seconds_count\", namespace=~\"^parsec-.*\"}[$__rate_interval])), 0.01)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Traffic Volume",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "Share of requests that did not fail with an internal error: 1 - failures / total requests.\n\nRejections (invalid credentials, policy denials, claim mapper denials) count as successes: parsec answered correctly. Failures are policy evaluation failures plus token issuance failures (issuance_failed, issuer_not_found).\n\nSome internal errors on uninstrumented paths are recorded as success, so this can overstate the real success rate.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 7,
            "y": 1
          },
          "id": 3,
          "interval": "5s",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table"
            },
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "1 - (\n    (sum(rate(parsec_authz_check_duration_seconds_count{namespace=~\"^parsec-.*\", result=\"policy_evaluation_failed\"}[$__rate_interval])) or vector(0))\n  + (sum(rate(parsec_token_issuance_duration_seconds_count{namespace=~\"^parsec-.*\", result=~\"issuance_failed|issuer_not_found\"}[$__rate_interval])) or vector(0))\n)\n/\nsum(rate({__name__=~\"parsec_(authz_check|token_exchange)_duration_seconds_count\", namespace=~\"^parsec-.*\"}[$__rate_interval]))",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Success Rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "Requests/s refused because of the caller's input: invalid or missing credentials, policy denials, malformed request_context and claim mapper denials (issuance_denied). These are not parsec errors; a sudden increase usually means a misconfigured client or abuse.\n\nBased on parsec result labels, not HTTP/gRPC status codes.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 12,
            "y": 1
          },
          "id": 4,
          "interval": "5s",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "legend": {
              "calcs": [
                "last",
                "max"
              ],
              "displayMode": "table"
            },
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "editorMode": "code",
              "expr": "round(\n    (sum(rate({__name__=~\"parsec_(authz_check|token_exchange)_duration_seconds_count\", namespace=~\"^parsec-.*\", status=\"error\", result!=\"policy_evaluation_failed\"}[$__rate_interval])) or vector(0))\n  + (sum(rate(parsec_token_issuance_duration_seconds_count{namespace=~\"^parsec-.*\", result=\"issuance_denied\"}[$__rate_interval])) or vector(0)),\n  0.01\n)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Rejections",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "description": "Requests/s that failed with an internal parsec error: policy evaluation failures (ext_authz) plus token issuance failures (issuance_failed, issuer_not_found, e.g. signing/KMS errors). Issuance failures come from the issuance metric, which covers both endpoints.\n\nBased on parsec result labels, not HTTP/gRPC status codes. Some internal errors on uninstrumented paths are recorded as success and are not counted here.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 5,
            "x": 17,
            "y": 1
          },
          "id": 5,
          "interval": "5s",
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "legend": {
              "calcs": [
