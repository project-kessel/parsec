          "description": "Number of requests served by parsec over the selected time range: ext_authz checks plus RFC 8693 token exchanges, across all parsec-* namespaces. Includes rejected and failed requests. Requests rejected by the transport before reaching a handler (and health checks / metrics scrapes) are not counted. Value is derived from increase() and may be slightly approximate.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 2,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text"
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
